name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # the release job attaches binaries on a tag

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '20'
  WAILS_VERSION: v2.17.0

jobs:
  # Fast gate: vet + race tests on Linux (the GUI build matrix is heavier).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install libpcap (CGO dependency)
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - name: Stub embedded frontend
        # main.go has //go:embed all:frontend/dist; the test gate doesn't build
        # the UI, so provide a placeholder to satisfy the embed for vet/test.
        run: mkdir -p frontend/dist && printf '<!doctype html><title>test</title>' > frontend/dist/index.html
      - run: go vet ./...
      - run: go test -race ./...

  build:
    name: build (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            artifact: albion-companion
            out: build/bin/albion-companion
          - name: windows
            os: windows-latest
            artifact: albion-companion.exe
            out: build/bin/albion-companion.exe
          - name: macos
            os: macos-latest
            artifact: albion-companion.app
            out: build/bin/albion-companion.app
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # --- platform capture / GUI dependencies -------------------------------
      - name: Linux deps (GTK/WebKit + libpcap)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libpcap-dev pkg-config build-essential

      - name: Windows deps (Npcap SDK for gopacket/pcap)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://npcap.com/dist/npcap-sdk-1.13.zip -OutFile npcap-sdk.zip
          Expand-Archive npcap-sdk.zip -DestinationPath "$env:GITHUB_WORKSPACE\npcap-sdk"
          "CGO_CFLAGS=-I$env:GITHUB_WORKSPACE\npcap-sdk\Include" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CGO_LDFLAGS=-L$env:GITHUB_WORKSPACE\npcap-sdk\Lib\x64" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      # --- build -------------------------------------------------------------
      - name: Build (Linux, WebKit 4.1)
        if: matrix.name == 'linux'
        env:
          CGO_ENABLED: '1'
        run: wails build -tags webkit2_41 -clean

      - name: Build (Windows / macOS)
        if: matrix.name != 'linux'
        env:
          CGO_ENABLED: '1'
        run: wails build -clean

      # macOS produces a .app bundle (a directory); zip it so it uploads intact.
      - name: Zip macOS app
        if: matrix.name == 'macos'
        run: |
          cd build/bin
          zip -r -y albion-companion-macos.app.zip albion-companion.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: albion-companion-${{ matrix.name }}
          path: |
            ${{ matrix.name == 'macos' && 'build/bin/albion-companion-macos.app.zip' || matrix.out }}
          if-no-files-found: error
          retention-days: 14

  # On a tagged release, attach the built binaries to the GitHub Release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          fail_on_unmatched_files: true
          generate_release_notes: true
